name: Importar código NEXPLAY
on:
  push:
    paths:
      - 'nexplay-source.tar.gz'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair fonte NEXPLAY com validação
        run: |
          python3 - <<'PY'
          import tarfile, pathlib
          a=pathlib.Path('nexplay-source.tar.gz')
          with tarfile.open(a, 'r:gz') as t:
              for member in t.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit('Entrada insegura no pacote')
                  if member.isfile() and (p.name.startswith('.env') and p.name != '.env.example'):
                      raise SystemExit('Arquivo de ambiente não permitido')
              t.extractall('.', filter='data')
          if not pathlib.Path('package.json').is_file():
              raise SystemExit('package.json não encontrado')
          PY
      - name: Commitar código-fonte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar aplicação NEXPLAY"
            git push
          fi
